name: Sicherheits-Check

on:
  push:
  pull_request:

# Der Check braucht nur Lesezugriff auf den Code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Code holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Theme und Konfiguration prüfen
        run: python3 -I tools/check.py
